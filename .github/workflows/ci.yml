name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['8', '25']

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Compile benchmarks
        if: matrix.java != '8'
        run: |
          mvn --batch-mode --no-transfer-progress -DskipTests -Djacoco.skip -Dspotless.check.skip -Dmaven.javadoc.skip install
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          mvn --batch-mode --no-transfer-progress -f bench/pom.xml -Deagerseq.version="$VERSION" compile
